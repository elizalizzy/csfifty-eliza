<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            //v
            function checkRuler(content){
                const correctPlaceholder = document.getElementById("correctRuler")
                if (content.innerText != "Peter the Great"){
                    correctPlaceholder.innerText = "Incorrect";
                    content.style.background = "red";
                }

                else{
                    correctPlaceholder.innerText = "Correct";
                    content.style.background = "green";
                 }
            }
            //for the free response
            function checkSmart(){
                const correctPlaceholder = document.getElementById("correctResponse");
                const freeResponseAnswer = document.getElementById("freeResponse");

                if (freeResponseAnswer.value != "Croatia"){
                    correctPlaceholder.innerText = "Incorrect";
                    freeResponseAnswer.style.background = "red";
                } else{
                    correctPlaceholder.innerText = "Correct";
                    freeResponseAnswer.style.background = "green";

                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                 <h3>Which Russian ruler was known for westernizing Russia in the early 18th century?</h3>
                 <p id="correctRuler"></p>
                 <button onclick="checkRuler(this)">Ivan the Terrible</button>
                 <button onclick="checkRuler(this)">Peter the Great</button>
                 <button onclick="checkRuler(this)">Catherine the Great</button>
                 <button onclick="checkRuler(this)">Nicholas II</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3>Which country was the most recent to join the European Union?</h3>
                 <p id ="correctResponse"></p>
                 <form>
                    <input type ="text" id ="freeResponse">
                 </form>
                 <button onclick="checkSmart()">Check Answer</button>
            </div>
        </div>
    </body>
</html>
